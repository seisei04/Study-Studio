<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Studio · Developer notebook</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f2;color:#172e32;font:17px/1.55 "Segoe UI",sans-serif}header{background:#163d40;color:white;padding:18px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}header b{font-size:22px;letter-spacing:-1px}header span{font-size:14px;color:#d5e7df}main{max-width:1150px;margin:35px auto;padding:0 22px}h1,h2,h3{line-height:1.12;letter-spacing:-.035em}h1{font: bold clamp(36px,6vw,65px)/1 Georgia;margin:10px 0 18px}h2{font-size:31px;margin:12px 0}h3{font-size:21px}button{cursor:pointer;font:inherit;color:inherit;border:1px solid #b8c6bd;border-radius:8px;background:white;padding:9px 15px}button:focus-visible,textarea:focus-visible{outline:3px solid #cb732c}button[aria-pressed=true],.primary{background:#174d49;color:white}.layout{display:grid;grid-template-columns:minmax(220px,1fr) minmax(0,2.5fr);gap:24px;margin:24px 0}aside,article{border:1px solid #d1dad1;background:white;border-radius:15px;padding:clamp(18px,3vw,34px)}aside{align-self:start}aside button{display:block;width:100%;text-align:left;margin:7px 0;border:0;font-size:15px}small{color:#47635e;font-weight:650}pre{background:#182e34;color:#e3f2df;padding:18px;border-radius:10px;overflow:auto;font:14px/1.55 Consolas,monospace}textarea{width:100%;min-height:105px;padding:12px;font:inherit;border:1px solid #9cafaa;border-radius:8px}label{display:block;font-weight:600;margin-top:12px}.choices button{margin:4px}progress{width:100%;accent-color:#19665a}#feedback{font-weight:600}#warning{color:#93431a}@media(max-width:700px){.layout{grid-template-columns:1fr}aside{padding:15px}main{margin-top:22px}}
</style>
<header><b>〈/〉 Study Studio</b><span>Developer notebook</span></header>
<main><h1>My learning studio</h1><p>Build your study planner, one skill at a time.</p><div id="tracks"></div><div id="warning" role="status"></div>
<div class="layout"><aside><small id="status"></small><progress id="progress" max="5"></progress><nav id="lessons" aria-label="Lessons"></nav></aside>
<article><small id="meta"></small><h2 id="title"></h2><p id="body"></p><pre><code id="example"></code></pre><p id="trace"></p><h3>Workbook</h3><p id="lab"></p><p id="test"></p><label for="notes">My prediction and what happened</label><textarea id="notes" placeholder="I expected… When I tried it…"></textarea><h3>Knowledge check</h3><p id="question"></p><div class="choices" id="answers"></div><p aria-live="polite" id="feedback"></p><button class="primary" id="finish">Complete lesson</button></article></div></main>
<script src="course.js"></script><script src="studio.js"></script></html>
